<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <radialGradient id="bg" cx="0.38" cy="0.62" r="0.75">
      <stop offset="0" stop-color="#1B2C70"/>
      <stop offset="0.55" stop-color="#0B1030"/>
      <stop offset="1" stop-color="#05060F"/>
    </radialGradient>
    <radialGradient id="hexGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF4FD8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FF4FD8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5FF3FF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#5FF3FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5FF3FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#5FF3FF" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <!-- background layer -->
  <rect width="108" height="108" fill="url(#bg)"/>
  <g fill="#DDF2FF">
    <circle cx="24" cy="44" r="0.7" opacity="0.6"/>
    <circle cx="82" cy="74" r="0.8" opacity="0.5"/>
    <circle cx="74" cy="86" r="0.6" opacity="0.4"/>
    <circle cx="36" cy="22" r="0.6" opacity="0.5"/>
    <circle cx="88" cy="28" r="0.7" opacity="0.4"/>
  </g>

  <!-- foreground layer -->
  <g transform="translate(54 55) scale(0.80) translate(-54 -56)">
  <!-- big magenta asteroid, the threat -->
  <circle cx="67" cy="41" r="30" fill="url(#hexGlow)"/>
  <g transform="rotate(12 67 41)">
  <path d="M84,41 L75.5,55.7 L58.5,55.7 L50,41 L58.5,26.3 L75.5,26.3 Z"
        fill="#FF4FD8" fill-opacity="0.32" stroke="#FF4FD8" stroke-width="3.4" stroke-linejoin="round"/>
  <path d="M84,41 L75.5,55.7 L58.5,55.7 L50,41 L58.5,26.3 L75.5,26.3 Z"
        fill="none" stroke="#FFD6F5" stroke-width="1" stroke-linejoin="round" opacity="0.7"/>
  <circle cx="67" cy="41" r="4" fill="#FF4FD8" opacity="0.8"/>
  </g>

  <!-- small orange asteroid, depth -->
  <path d="M37,31 L33.5,37 L26.5,37 L23,31 L26.5,25 L33.5,25 Z"
        fill="#FF9E4F" fill-opacity="0.12" stroke="#FF9E4F" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- small lime asteroid, balance -->
  <path d="M86,82 L83.5,86.3 L78.5,86.3 L76,82 L78.5,77.7 L83.5,77.7 Z"
        fill="#B6FF5C" fill-opacity="0.15" stroke="#B6FF5C" stroke-width="2" stroke-linejoin="round"/>

  <!-- swerving trail -->
  <path d="M30,98 C30,88 32,80 36,74 C38,69 40,67 43,66"
        fill="none" stroke="url(#trail)" stroke-width="7" stroke-linecap="round"/>
  <circle cx="25" cy="88" r="1.6" fill="#5FF3FF" opacity="0.5"/>
  <circle cx="37" cy="92" r="1.2" fill="#5FF3FF" opacity="0.4"/>

  <!-- player orb -->
  <circle cx="45" cy="64" r="24" fill="url(#orbGlow)"/>
  <circle cx="45" cy="64" r="13.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2"/>
  <circle cx="45" cy="64" r="10" fill="#5FF3FF"/>
  <circle cx="45" cy="64" r="6.3" fill="#BFFAFF"/>
  <circle cx="45" cy="64" r="3" fill="#FFFFFF"/>

  <!-- near-miss spark -->
  <path d="M56,52.5 Q56.6,55.4 59.5,56 Q56.6,56.6 56,59.5 Q55.4,56.6 52.5,56 Q55.4,55.4 56,52.5 Z" fill="#FFF3C4"/>
  </g>
</svg>
